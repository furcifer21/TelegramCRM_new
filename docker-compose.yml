version: '3.8'
services:
  nodejs:
    image: node:20
    container_name: tgcrm
    restart: 'no'
    working_dir: /var/www/html
    ports:
      - 3000:3000
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0 # только для локальной разработки, для отключения проверки SSL/TLS